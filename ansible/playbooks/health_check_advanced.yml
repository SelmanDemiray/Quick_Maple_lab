---
- name: Collect advanced health metrics from containers
  hosts: all
  gather_facts: yes
  become: yes
  tasks:
    # Check for basic system info first
    - name: Get system uptime
      shell: uptime
      register: uptime_result
      changed_when: false

    - name: Get memory usage
      shell: free -m
      register: memory_result
      changed_when: false

    - name: Get disk usage
      shell: df -h /
      register: disk_result
      changed_when: false

    - name: Run standard health check first
      import_playbook: health_check.yml

    - name: Set host-specific service checks
      set_fact:
        service_checks: >-
          {% if inventory_hostname == 'isc-dhcp-server' %}
          ['isc-dhcp-server']
          {% elif inventory_hostname == 'opensearch-dashboard' %}
          ['opensearch', 'opensearch-dashboards']
          {% elif inventory_hostname == 'pihole' %}
          ['pihole-FTL']
          {% elif inventory_hostname == 'suricata-filebeat' %}
          ['suricata', 'filebeat']
          {% else %}
          []
          {% endif %}

    # Initialize service status dictionary
    - name: Initialize service status dictionary
      set_fact:
        service_status: {}

    # Check if services exist before checking their status
    - name: Check if services exist
      stat:
        path: "/lib/systemd/system/{{ item }}.service"
      register: service_exists
      loop: "{{ service_checks }}"
      ignore_errors: yes

    # Check each service with systemctl is-active
    - name: Get service status for each service
      shell: "systemctl is-active {{ item.item }} || echo 'inactive'"
      register: service_status_result
      changed_when: false
      loop: "{{ service_exists.results }}"
      when: item.stat.exists | default(false)
      ignore_errors: yes

    # Process each service status
    - name: Process each service status
      set_fact:
        service_status: "{{ service_status | combine({item.item.item: (item.stdout == 'active')}) }}"
      with_items: "{{ service_status_result.results | default([]) }}"
      when: item.item is defined

    # Check network connectivity
    - name: Check network connectivity
      shell: "ping -c 1 8.8.8.8 > /dev/null && echo success || echo fail"
      register: network_check
      changed_when: false
      ignore_errors: yes

    # DHCP Server specific checks
    - name: Get DHCP lease count
      shell: "test -f /var/lib/dhcp/dhcpd.leases && grep -c ^lease /var/lib/dhcp/dhcpd.leases || echo 0"
      register: dhcp_leases
      changed_when: false
      when: "'isc-dhcp-server' in inventory_hostname"
      ignore_errors: yes

    - name: Validate DHCP configuration
      shell: "test -f /etc/dhcp/dhcpd.conf && dhcpd -t -cf /etc/dhcp/dhcpd.conf > /dev/null; echo $?"
      register: dhcp_config_validation
      changed_when: false
      when: "'isc-dhcp-server' in inventory_hostname"
      ignore_errors: yes

    # OpenSearch specific checks
    - name: Get OpenSearch cluster health
      shell: >
        curl -s -k -u admin:MkB-{8Ab3sn2[@_hgWKK 
        https://localhost:9200/_cluster/health | 
        grep -o '"status":"[^"]*"' || echo 'status:unknown'
      register: opensearch_status
      changed_when: false
      when: "'opensearch-dashboard' in inventory_hostname"
      ignore_errors: yes

    - name: Get OpenSearch indices count
      shell: >
        curl -s -k -u admin:MkB-{8Ab3sn2[@_hgWKK 
        https://localhost:9200/_cat/indices?v | wc -l
      register: opensearch_indices
      changed_when: false
      when: "'opensearch-dashboard' in inventory_hostname"
      ignore_errors: yes

    # Pi-hole specific checks
    - name: Get Pi-hole blocked domains count
      shell: "command -v pihole > /dev/null && pihole -c -j | grep -o '\"domains_being_blocked\":[^,]*' | cut -d: -f2 || echo 0"
      register: pihole_blocked_domains
      changed_when: false
      when: "'pihole' in inventory_hostname"
      ignore_errors: yes

    - name: Test DNS resolution
      shell: "command -v dig > /dev/null && dig +short google.com @localhost | grep -v '^$' | wc -l || echo 0"
      register: dns_resolution_test
      changed_when: false
      when: "'pihole' in inventory_hostname"
      ignore_errors: yes

    # Suricata specific checks
    - name: Get Suricata alert count
      shell: "test -f /var/log/suricata/stats.log && grep -c alert /var/log/suricata/stats.log || echo 0"
      register: suricata_alerts
      changed_when: false
      when: "'suricata-filebeat' in inventory_hostname"
      ignore_errors: yes

    - name: Get Filebeat events stats
      shell: "command -v filebeat > /dev/null && filebeat test output | grep -o 'events.*' || echo 'events: 0'"
      register: filebeat_events
      changed_when: false
      when: "'suricata-filebeat' in inventory_hostname"
      ignore_errors: yes

    # Collect additional check results
    - name: Set additional check data - DHCP server
      set_fact:
        additional_checks:
          dhcp_lease_count:
            status: true
            value: "{{ dhcp_leases.stdout|int }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
          dhcp_config_validation:
            status: "{{ dhcp_config_validation.stdout|int == 0 }}"
            value: "{{ dhcp_config_validation.stdout }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
      when: "'isc-dhcp-server' in inventory_hostname"

    - name: Set additional check data - OpenSearch
      set_fact:
        additional_checks:
          opensearch_status:
            status: "{{ opensearch_status.stdout|regex_search('(green|yellow)') != None }}"
            value: "{{ opensearch_status.stdout }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
          opensearch_indices:
            status: true
            value: "{{ opensearch_indices.stdout|int }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
      when: "'opensearch-dashboard' in inventory_hostname"

    - name: Set additional check data - Pi-hole
      set_fact:
        additional_checks:
          pihole_blocked_domains:
            status: true
            value: "{{ pihole_blocked_domains.stdout|int }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
          dns_resolution_test:
            status: "{{ dns_resolution_test.stdout|int > 0 }}"
            value: "{{ dns_resolution_test.stdout|int }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
      when: "'pihole' in inventory_hostname"

    - name: Set additional check data - Suricata
      set_fact:
        additional_checks:
          suricata_alerts:
            status: true
            value: "{{ suricata_alerts.stdout }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
          filebeat_events:
            status: true
            value: "{{ filebeat_events.stdout }}"
            check_time: "{{ ansible_date_time.iso8601 }}"
      when: "'suricata-filebeat' in inventory_hostname"

    # Collect all status data
    - name: Collect all status data
      set_fact:
        health_status:
          hostname: "{{ inventory_hostname }}"
          uptime: "{{ uptime_result.stdout }}"
          memory: "{{ memory_result.stdout_lines }}"
          disk: "{{ disk_result.stdout_lines }}"
          services: "{{ service_status }}"
          additional_checks: "{{ additional_checks | default({}) }}"
          network: "{{ network_check.stdout == 'success' }}"
          ip: "{{ ansible_host }}"
          last_check: "{{ ansible_date_time.iso8601 }}"

    - name: Create local directory for status files
      delegate_to: localhost
      file:
        path: "/home/ansible/retry/ansible/health_checks"
        state: directory
        mode: '0755'
      become: no
      changed_when: false

    - name: Store health status locally
      delegate_to: localhost
      copy:
        content: "{{ health_status | to_nice_json }}"
        dest: "/home/ansible/retry/ansible/health_checks/{{ inventory_hostname }}_status.json"
        mode: '0644'
      become: no
      changed_when: false
