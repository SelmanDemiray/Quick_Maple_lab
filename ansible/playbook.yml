---
- name: Deploy complete homelab infrastructure
  import_playbook: network.yml

- name: Deploy security monitoring infrastructure  
  import_playbook: security.yml

- name: Display complete setup information
  hosts: localhost
  gather_facts: no
  tasks:
    - name: Display all service access information
      debug:
        msg:
          - "Complete homelab setup finished successfully!"
          - "All services available:"
          - "Pi-hole admin: http://{{ groups['pihole_group'][0] }}/admin"
          - "OpenSearch dashboard: http://{{ groups['opensearch'][0] }}:5601"
          - "DHCP server configured on: {{ groups['dhcp'][0] }}"
          - "Suricata logs shipping to OpenSearch via Data Prepper"
