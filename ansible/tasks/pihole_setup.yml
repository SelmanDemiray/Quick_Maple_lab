---
# Tasks for setting up Pi-hole DNS server

# Check network connectivity before proceeding
- name: Check network connectivity
  command: ping -c 1 8.8.8.8
  register: ping_result
  ignore_errors: true
  changed_when: false

- name: Check DNS resolution
  command: nslookup github.com
  register: dns_result
  ignore_errors: true
  changed_when: false

# Display debug information if network checks fail
- name: Display network diagnostics
  debug:
    msg: 
      - "Network connectivity: {{ 'OK' if ping_result.rc == 0 else 'FAILED' }}"
      - "DNS resolution: {{ 'OK' if dns_result.rc == 0 else 'FAILED' }}"
  when: ping_result.rc != 0 or dns_result.rc != 0

# Fix DNS resolving if needed
- name: Configure resolv.conf if DNS is failing
  copy:
    content: |
      nameserver 8.8.8.8
      nameserver 1.1.1.1
    dest: /etc/resolv.conf
  when: dns_result.rc != 0
  ignore_errors: true

# Install packages with error handling
- name: Install required packages with fallbacks
  block:
    - name: Try installing packages with apt
      apt:
        name:
          - curl
          - dnsutils
        state: present
        update_cache: yes
      register: apt_result
  rescue:
    - name: Alternate method - Update APT sources manually
      shell: apt-get update --allow-releaseinfo-change
      ignore_errors: true

    - name: Alternate method - Install packages without cache update
      apt:
        name:
          - curl
          - dnsutils
        state: present
        update_cache: no
      ignore_errors: true
      
    - name: Install curl directly if still missing
      shell: apt-get install -y curl
      args:
        creates: /usr/bin/curl
      ignore_errors: true

# Continue with Pi-hole setup if curl is available
- name: Check if curl is installed
  stat:
    path: /usr/bin/curl
  register: curl_stat

- name: Create Pi-hole install directory
  file:
    path: /root/pihole-install
    state: directory
    mode: '0755'
  when: curl_stat.stat.exists

- name: Download Pi-hole installer using curl command
  shell: curl -sSL https://install.pi-hole.net -o /root/pihole-install/install.sh
  args:
    creates: /root/pihole-install/install.sh
  register: pihole_download
  when: curl_stat.stat.exists
  ignore_errors: true
  changed_when: pihole_download.rc == 0

- name: Make Pi-hole installer executable
  file:
    path: /root/pihole-install/install.sh
    mode: '0755'
  when: pihole_download is defined and pihole_download.rc == 0
  ignore_errors: true

- name: Create Pi-hole setupVars.conf
  template:
    src: templates/setupVars.conf.j2
    dest: /root/pihole-install/setupVars.conf
    mode: '0644'
  when: pihole_download is defined and pihole_download.rc == 0
  ignore_errors: true

- name: Create /etc/pihole directory
  file:
    path: /etc/pihole
    state: directory
    mode: '0755'
  when: pihole_download is defined and pihole_download.rc == 0
  ignore_errors: true

- name: Copy setupVars.conf to /etc/pihole (required for unattended install)
  copy:
    src: /root/pihole-install/setupVars.conf
    dest: /etc/pihole/setupVars.conf
    remote_src: yes
    mode: '0644'
  when: pihole_download is defined and pihole_download.rc == 0
  ignore_errors: true

- name: Run Pi-hole installer with timeout
  shell: |
    cd /root/pihole-install
    export PIHOLE_SKIP_OS_CHECK=true
    timeout 300 ./install.sh --unattended > /var/log/pihole_install.log 2>&1
  args:
    creates: /usr/local/bin/pihole
  register: pihole_install
  when: pihole_download is defined and pihole_download.rc == 0
  changed_when: pihole_install.rc == 0
  ignore_errors: true
  async: 600
  poll: 10

- name: Display Pi-hole installation log
  shell: tail -n 20 /var/log/pihole_install.log
  register: pihole_log
  changed_when: false
  ignore_errors: true
  when: pihole_install is defined

- name: Show Pi-hole installation log
  debug:
    var: pihole_log.stdout_lines
  when: pihole_log is defined

# Remaining tasks are only executed if Pi-hole installation succeeded
- name: Get current Pi-hole password hash
  shell: grep WEBPASSWORD /etc/pihole/setupVars.conf || echo "WEBPASSWORD=not_found"
  register: current_password
  changed_when: false
  when: pihole_install is defined and (pihole_install.changed or ansible_check_mode)
  ignore_errors: true

- name: Generate Pi-hole password hash
  shell: echo -n "{{ pihole_webpassword }}" | sha256sum | awk '{print $1}'
  register: password_hash
  changed_when: false
  when: pihole_install is defined and (pihole_install.changed or ansible_check_mode)
  ignore_errors: true
  no_log: true  # Don't log password hash

- name: Update Pi-hole password by directly editing setupVars.conf
  lineinfile:
    path: /etc/pihole/setupVars.conf
    regexp: '^WEBPASSWORD='
    line: 'WEBPASSWORD={{ password_hash.stdout }}'
  register: password_update
  when: password_hash is defined and password_hash.stdout | length > 0
  ignore_errors: true

- name: Get updated Pi-hole password hash
  shell: grep WEBPASSWORD /etc/pihole/setupVars.conf || echo "WEBPASSWORD=not_found"
  register: updated_password
  changed_when: false
  when: password_update is defined
  ignore_errors: true

- name: Debug password update process
  debug:
    msg: 
      - "Original password hash: {{ current_password.stdout if current_password is defined else 'undefined' }}"
      - "Updated password hash: {{ updated_password.stdout if updated_password is defined else 'undefined' }}"
      - "Password change detected: {{ current_password.stdout != updated_password.stdout if current_password is defined and updated_password is defined else 'unknown' }}"
  when: current_password is defined and updated_password is defined

- name: Check for web server service
  shell: systemctl list-units --type=service | grep -E 'lighttpd|apache2|nginx' || echo "No web server found"
  register: web_server_check
  changed_when: false
  ignore_errors: true

- name: Debug web server service name
  debug:
    var: web_server_check.stdout_lines
  when: web_server_check is defined

- name: Install lighttpd if not found
  apt:
    name: lighttpd
    state: present
  when: web_server_check.stdout is defined and "No web server found" in web_server_check.stdout
  register: lighttpd_installed
  ignore_errors: true

- name: Create Pi-hole web interface directories
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /var/www/html/admin
    - /etc/lighttpd
  when: lighttpd_installed is defined and lighttpd_installed.changed
  ignore_errors: true

- name: Enable lighttpd service
  systemd:
    name: lighttpd
    state: started
    enabled: yes
  when: lighttpd_installed is defined
  ignore_errors: true

- name: Check if Pi-hole web interface exists
  stat:
    path: /var/www/html/admin/index.php
  register: pihole_web_interface
  ignore_errors: true

- name: Reinstall Pi-hole web interface if missing
  shell: |
    cd /root/pihole-install
    export PIHOLE_SKIP_OS_CHECK=true
    export INSTALL_WEB_INTERFACE=true
    export INSTALL_WEB_SERVER=true
    timeout 300 ./install.sh --unattended --web-only > /var/log/pihole_web_install.log 2>&1
  when: pihole_web_interface is defined and not pihole_web_interface.stat.exists
  ignore_errors: true
  register: web_interface_install
  async: 600
  poll: 10

- name: Display Pi-hole web interface installation log
  shell: tail -n 20 /var/log/pihole_web_install.log
  register: web_interface_log
  changed_when: false
  ignore_errors: true
  when: web_interface_install is defined

- name: Show Pi-hole web interface installation log
  debug:
    var: web_interface_log.stdout_lines
  when: web_interface_log is defined

- name: Ensure lighttpd web server is properly installed
  apt:
    name: 
      - lighttpd
      - php-common
      - php-cgi
      - php-sqlite3
    state: present
  ignore_errors: true
  when: web_server_check.stdout is defined and "No web server found" in web_server_check.stdout

- name: Set lighttpd permissions
  file:
    path: /etc/lighttpd
    state: directory
    mode: '0755'
  ignore_errors: true
  
- name: Enable lighttpd fastcgi
  shell: lighty-enable-mod fastcgi fastcgi-php
  register: fastcgi_enabled
  changed_when: "'already enabled' not in fastcgi_enabled.stdout"
  failed_when: false
  ignore_errors: true

- name: Restart lighttpd service
  systemd:
    name: lighttpd
    state: restarted
  ignore_errors: true
  when: fastcgi_enabled is changed

- name: Restart Pi-hole and web services
  systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - pihole-FTL
    - lighttpd
  when: password_update is defined and password_update.changed or lighttpd_installed is defined or web_interface_install is defined
  ignore_errors: true
  failed_when: false  # Prevent failing if a service doesn't exist

- name: Verify Pi-hole is responding
  uri:
    url: "http://localhost/admin/"
    status_code: 200
    timeout: 5
  register: pihole_web_check
  ignore_errors: true
  retries: 3
  delay: 5
  until: pihole_web_check is success

- name: Display Pi-hole web status
  debug:
    msg: "Pi-hole web interface is {{ 'accessible' if pihole_web_check is success else 'not accessible' }}"
  when: pihole_web_check is defined

- name: Check for web server service
  shell: systemctl list-units --type=service | grep -E 'lighttpd|apache2|nginx' || echo "No web server found"
  register: web_server_check
  changed_when: false
  ignore_errors: true

- name: Debug web server service name
  debug:
    var: web_server_check.stdout_lines
  when: web_server_check is defined

- name: Restart Pi-hole services
  systemd:
    name: pihole-FTL
    state: restarted
  when: password_update is defined and password_update.changed
  ignore_errors: true

- name: Configure Pi-hole upstream DNS
  lineinfile:
    path: /etc/pihole/setupVars.conf
    regexp: '^PIHOLE_DNS_1='
    line: 'PIHOLE_DNS_1=1.1.1.1'
  when: pihole_install is defined and pihole_install.changed
  ignore_errors: true

- name: Configure Pi-hole additional blocklists
  lineinfile:
    path: /etc/pihole/adlists.list
    line: "{{ item }}"
    state: present
    create: yes
  loop:
    - "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
    - "https://s3.amazonaws.com/lists.disconnect.me/simple_tracking.txt"
    - "https://s3.amazonaws.com/lists.disconnect.me/simple_ad.txt"
  when: pihole_install is defined and pihole_install.changed
  ignore_errors: true

- name: Update Pi-hole Gravity
  command: pihole -g
  changed_when: false
  when: pihole_install is defined and pihole_install.changed
  ignore_errors: true

# Define Pi-hole handlers
- name: Register Pi-hole handlers
  set_fact:
    pihole_handlers_registered: true

- name: Add handlers to restart services
  meta: flush_handlers
  when: pihole_handlers_registered is defined

# Define the handlers at play level
- name: Restart Pi-hole DNS
  systemd:
    name: pihole-FTL
    state: restarted
  when: pihole_handlers_registered is defined

- name: Update Pi-hole Gravity
  command: pihole -g
  changed_when: false
  when: pihole_handlers_registered is defined
