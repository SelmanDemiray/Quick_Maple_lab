---
# Tasks for setting up OpenSearch and OpenSearch Dashboard

# Register handlers at the beginning
- name: Register OpenSearch handlers
  set_fact:
    opensearch_handlers_registered: true

- name: Install required packages
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg2
      - curl
      - openjdk-11-jdk
    state: present
    update_cache: yes

# Check system memory and set variables
- name: Get available memory
  shell: grep MemTotal /proc/meminfo | awk '{print $2}'
  register: mem_total
  changed_when: false

- name: Set heap size based on available memory
  set_fact:
    heap_size: "{{ [((mem_total.stdout|int / 1024 / 1024 * 0.5)|int), 1]|max }}g"
  when: mem_total.stdout is defined

- name: Add OpenSearch GPG key
  apt_key:
    url: https://artifacts.opensearch.org/publickeys/opensearch.pgp
    state: present

- name: Add OpenSearch repository
  apt_repository:
    repo: "deb https://artifacts.opensearch.org/releases/bundle/opensearch/2.x/apt stable main"
    state: present
    filename: opensearch-2.x
    update_cache: yes

- name: Add OpenSearch Dashboard repository
  apt_repository:
    repo: "deb https://artifacts.opensearch.org/releases/bundle/opensearch-dashboards/2.x/apt stable main"
    state: present
    filename: opensearch-dashboards-2.x
    update_cache: yes

- name: Prepare for OpenSearch installation
  file:
    path: /etc/opensearch
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Disable OpenSearch demo config
  copy:
    content: "OPENSEARCH_INITIAL_ADMIN_PASSWORD=\nOPENSEARCH_SKIP_DEMO_CONFIG=true\n"
    dest: /etc/opensearch/opensearch-env
    mode: '0644'
    owner: root
    group: root

# Remove any partially installed OpenSearch package
- name: Remove existing OpenSearch packages
  apt:
    name: opensearch
    state: absent
    purge: yes
  failed_when: false

# Install OpenSearch with specific version and allow downgrades
- name: Install OpenSearch with specific configuration
  shell: DEBIAN_FRONTEND=noninteractive apt-get -y --allow-downgrades -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confnew" install opensearch=2.8.0
  environment:
    OPENSEARCH_SKIP_DEMO_CONFIG: "true"
    OPENSEARCH_INITIAL_ADMIN_PASSWORD: ""
  register: opensearch_install
  retries: 3
  delay: 5
  until: opensearch_install is not failed
  failed_when: opensearch_install.rc != 0 and "already the newest version" not in opensearch_install.stderr

# Install dashboard with allow downgrades
- name: Install OpenSearch Dashboards
  shell: DEBIAN_FRONTEND=noninteractive apt-get -y --allow-downgrades -o Dpkg::Options::="--force-confdef" -o Dpkg::Options::="--force-confnew" install opensearch-dashboards=2.8.0
  register: dashboard_install
  retries: 3
  delay: 5
  until: dashboard_install is not failed
  failed_when: dashboard_install.rc != 0 and "already the newest version" not in dashboard_install.stderr

# Create directories and set proper permissions
- name: Set proper permissions for OpenSearch directories
  file:
    path: "{{ item }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0755'
    recurse: yes
  loop:
    - /var/log/opensearch
    - /var/lib/opensearch
  when: opensearch_install.rc is defined and opensearch_install.rc == 0
  failed_when: false

- name: Configure OpenSearch
  template:
    src: templates/opensearch.yml.j2
    dest: /etc/opensearch/opensearch.yml
    owner: opensearch
    group: opensearch
    mode: '0644'
  register: opensearch_config
  failed_when: false

- name: Configure OpenSearch JVM options
  template:
    src: templates/jvm.options.j2
    dest: /etc/opensearch/jvm.options.d/custom-heap.options
    owner: opensearch
    group: opensearch
    mode: '0644'
  register: opensearch_jvm
  failed_when: false

- name: Configure OpenSearch Dashboard
  template:
    src: templates/opensearch_dashboards.yml.j2
    dest: /etc/opensearch-dashboards/opensearch_dashboards.yml
    owner: opensearch-dashboards
    group: opensearch-dashboards
    mode: '0644'
  register: opensearch_dashboard_config
  failed_when: false

# Directly restart services when configurations change
- name: Restart OpenSearch after configuration
  systemd:
    name: opensearch
    state: restarted
  when: opensearch_install.rc is defined and opensearch_install.rc == 0 and (opensearch_config.changed or opensearch_jvm.changed)
  failed_when: false

- name: Restart OpenSearch Dashboard after configuration
  systemd:
    name: opensearch-dashboards
    state: restarted
  when: dashboard_install.rc is defined and dashboard_install.rc == 0 and opensearch_dashboard_config.changed
  failed_when: false

- name: Enable and start OpenSearch service
  systemd:
    name: opensearch
    enabled: yes
    state: started
  retries: 3
  delay: 10
  register: opensearch_service
  until: opensearch_service is not failed
  failed_when: false

- name: Enable and start OpenSearch Dashboard service
  systemd:
    name: opensearch-dashboards
    enabled: yes
    state: started
  retries: 3
  delay: 10
  register: dashboard_service
  until: dashboard_service is not failed
  failed_when: false

# Define the handlers at play level
- name: Restart OpenSearch
  systemd:
    name: opensearch
    state: restarted
  when: opensearch_handlers_registered is defined
  failed_when: false

- name: Restart OpenSearch Dashboard
  systemd:
    name: opensearch-dashboards
    state: restarted
  when: opensearch_handlers_registered is defined
  failed_when: false
