---
- name: Install Java
  apt:
    name: openjdk-11-jdk
    state: present

- name: Create OpenSearch group
  group:
    name: opensearch
    state: present

- name: Create OpenSearch user
  user:
    name: opensearch
    group: opensearch
    system: yes
    state: present

- name: Create OpenSearch directories
  file:
    path: "{{ item }}"
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0750'
  loop:
    - /var/lib/opensearch
    - /var/log/opensearch
    - /etc/opensearch

# Check if the direct opensearch directory exists (not a symlink)
- name: Check if opensearch directory exists and is not a symlink
  stat:
    path: /opt/opensearch
  register: opensearch_dir

# Remove directory if it exists but isn't a symlink
- name: Remove opensearch directory if it's not a symlink
  file:
    path: /opt/opensearch
    state: absent
  when: opensearch_dir.stat.exists and not opensearch_dir.stat.islnk

# Check if opensearch-2.5.0 directory exists
- name: Check for existing opensearch-2.5.0 directory
  stat:
    path: /opt/opensearch-2.5.0
  register: opensearch_version_dir

# Remove old version directory if it exists
- name: Remove old opensearch-2.5.0 directory if present
  file:
    path: /opt/opensearch-2.5.0
    state: absent
  when: opensearch_version_dir.stat.exists

- name: Download OpenSearch
  get_url:
    url: https://artifacts.opensearch.org/releases/bundle/opensearch/2.5.0/opensearch-2.5.0-linux-x64.tar.gz
    dest: /tmp/opensearch.tar.gz
    mode: '0644'
  register: opensearch_download

- name: Extract OpenSearch
  unarchive:
    src: /tmp/opensearch.tar.gz
    dest: /opt/
    remote_src: yes
    owner: opensearch
    group: opensearch
  when: opensearch_download is success
  register: opensearch_extract

- name: Create OpenSearch symbolic link
  file:
    src: /opt/opensearch-2.5.0
    dest: /opt/opensearch
    state: link
    owner: opensearch
    group: opensearch
    force: yes
  when: opensearch_extract is success or opensearch_extract is skipped

- name: Configure OpenSearch
  template:
    src: opensearch.yml.j2
    dest: /opt/opensearch/config/opensearch.yml
    owner: opensearch
    group: opensearch
    mode: '0644'
  notify: restart opensearch

- name: Configure JVM options
  template:
    src: jvm.options.j2
    dest: /opt/opensearch/config/jvm.options
    owner: opensearch
    group: opensearch
    mode: '0644'
  notify: restart opensearch

- name: Create OpenSearch systemd service
  template:
    src: opensearch.service.j2
    dest: /etc/systemd/system/opensearch.service
    owner: root
    group: root
    mode: '0644'
  notify: systemd daemon-reload

- name: Set system limits for OpenSearch
  pam_limits:
    domain: opensearch
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  loop:
    - { limit_type: soft, limit_item: nofile, value: 65536 }
    - { limit_type: hard, limit_item: nofile, value: 65536 }
    - { limit_type: soft, limit_item: memlock, value: unlimited }
    - { limit_type: hard, limit_item: memlock, value: unlimited }

- name: Set kernel parameters for OpenSearch
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
  loop:
    - { name: vm.max_map_count, value: 262144 }

- name: Ensure OpenSearch is listening on all interfaces
  lineinfile:
    path: /opt/opensearch/config/opensearch.yml
    regexp: '^network.host:'
    line: 'network.host: 0.0.0.0'
    state: present
  notify: restart opensearch

- name: Enable and start OpenSearch service
  systemd:
    name: opensearch
    enabled: yes
    state: started
    daemon_reload: yes

- name: Install OpenSSL
  apt:
    name: openssl
    state: present

- name: Create certificates directory
  file:
    path: /opt/opensearch/config/certificates
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0750'

- name: Generate root CA key
  command: openssl genrsa -out /opt/opensearch/config/certificates/root-ca-key.pem 2048
  args:
    creates: /opt/opensearch/config/certificates/root-ca-key.pem
  become: yes
  become_user: opensearch

- name: Generate root CA certificate
  command: >
    openssl req -new -x509 -sha256 
    -key /opt/opensearch/config/certificates/root-ca-key.pem 
    -out /opt/opensearch/config/certificates/root-ca.pem 
    -days 1095 
    -subj "/C=US/ST=CA/L=Mountain View/O=OpenSearch/CN=root-ca"
  args:
    creates: /opt/opensearch/config/certificates/root-ca.pem
  become: yes
  become_user: opensearch

- name: Generate node key
  command: openssl genrsa -out /opt/opensearch/config/certificates/esnode-key.pem 2048
  args:
    creates: /opt/opensearch/config/certificates/esnode-key.pem
  become: yes
  become_user: opensearch

- name: Generate node CSR
  command: >
    openssl req -new 
    -key /opt/opensearch/config/certificates/esnode-key.pem 
    -out /opt/opensearch/config/certificates/esnode.csr 
    -subj "/C=US/ST=CA/L=Mountain View/O=OpenSearch/CN=opensearch-node"
  args:
    creates: /opt/opensearch/config/certificates/esnode.csr
  become: yes
  become_user: opensearch

- name: Generate node certificate
  command: >
    openssl x509 -req 
    -in /opt/opensearch/config/certificates/esnode.csr 
    -CA /opt/opensearch/config/certificates/root-ca.pem 
    -CAkey /opt/opensearch/config/certificates/root-ca-key.pem 
    -CAcreateserial 
    -sha256 
    -out /opt/opensearch/config/certificates/esnode.pem 
    -days 1095
  args:
    creates: /opt/opensearch/config/certificates/esnode.pem
  become: yes
  become_user: opensearch

- name: Verify certificate files exist
  stat:
    path: "/opt/opensearch/config/certificates/{{ item }}"
  register: cert_files
  with_items:
    - root-ca.pem
    - esnode.pem
    - esnode-key.pem

- name: Debug certificate file status
  debug:
    msg: "Certificate {{ item.item }} exists: {{ item.stat.exists }}"
  with_items: "{{ cert_files.results }}"

- name: Update certificates ownership
  file:
    path: "/opt/opensearch/config/certificates/{{ item.item }}"
    owner: opensearch
    group: opensearch
    mode: '0640'
  with_items: "{{ cert_files.results }}"
  when: item.stat.exists

- name: Ensure opensearch-security config directory exists
  file:
    path: /opt/opensearch/config/opensearch-security
    state: directory
    owner: opensearch
    group: opensearch
    mode: '0750'

- name: Copy internal_users.yml template
  template:
    src: internal_users.yml.j2
    dest: /opt/opensearch/config/opensearch-security/internal_users.yml
    owner: opensearch
    group: opensearch
    mode: '0640'
  register: security_settings
  notify: restart opensearch

- name: Copy roles.yml template
  template:
    src: roles.yml
    dest: /opt/opensearch/config/opensearch-security/roles.yml
    owner: opensearch
    group: opensearch
    mode: '0640'
  register: roles_settings
  notify: restart opensearch

- name: Copy roles_mapping.yml template
  template:
    src: roles_mapping.yml
    dest: /opt/opensearch/config/opensearch-security/roles_mapping.yml
    owner: opensearch
    group: opensearch
    mode: '0640'
  register: roles_mapping_settings
  notify: restart opensearch

- name: Check if securityadmin.sh exists
  stat:
    path: /opt/opensearch/plugins/opensearch-security/tools/securityadmin.sh
  register: securityadmin_check

- name: Set executable permissions on securityadmin.sh
  file:
    path: /opt/opensearch/plugins/opensearch-security/tools/securityadmin.sh
    mode: '0755'
    state: file
  when: securityadmin_check.stat.exists
  become: yes

- name: Wait for OpenSearch service to be fully operational
  wait_for:
    host: localhost
    port: 9200
    delay: 15
    timeout: 180
  register: opensearch_available

- name: Initialize security index
  command: >
    /opt/opensearch/plugins/opensearch-security/tools/securityadmin.sh 
    -cd /opt/opensearch/config/opensearch-security/ 
    -icl -nhnv 
    -cacert /opt/opensearch/config/certificates/root-ca.pem 
    -cert /opt/opensearch/config/certificates/esnode.pem 
    -key /opt/opensearch/config/certificates/esnode-key.pem
  become: yes
  become_user: opensearch
  when: 
    (security_settings.changed or roles_settings.changed or roles_mapping_settings.changed)
    and cert_files is defined
    and cert_files.results | selectattr('item', 'equalto', 'esnode.pem') | map(attribute='stat.exists') | list | first
    and cert_files.results | selectattr('item', 'equalto', 'esnode-key.pem') | map(attribute='stat.exists') | list | first
    and cert_files.results | selectattr('item', 'equalto', 'root-ca.pem') | map(attribute='stat.exists') | list | first
    and securityadmin_check.stat.exists
    and opensearch_available is success
  ignore_errors: yes
  notify: restart opensearch

- name: Force security index update
  command: >
    /opt/opensearch/plugins/opensearch-security/tools/securityadmin.sh 
    -cd /opt/opensearch/config/opensearch-security/ 
    -icl -nhnv 
    -cacert /opt/opensearch/config/certificates/root-ca.pem 
    -cert /opt/opensearch/config/certificates/esnode.pem 
    -key /opt/opensearch/config/certificates/esnode-key.pem
    -rl
  become: yes
  become_user: opensearch
  when: cert_files.results | selectattr('item', 'equalto', 'esnode.pem') | map(attribute='stat.exists') | list | first and
        cert_files.results | selectattr('item', 'equalto', 'esnode-key.pem') | map(attribute='stat.exists') | list | first and
        cert_files.results | selectattr('item', 'equalto', 'root-ca.pem') | map(attribute='stat.exists') | list | first and
        securityadmin_check.stat.exists
  ignore_errors: yes
  notify: restart opensearch
