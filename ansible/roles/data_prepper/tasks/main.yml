---
- name: Ensure Java is installed
  apt:
    name: "{{ 'openjdk-17-jre-headless' if ansible_distribution_major_version is version('12', '>=') else 'openjdk-11-jre-headless' }}"
    state: present

- name: Download Data Prepper
  get_url:
    url: https://artifacts.opensearch.org/data-prepper/2.5.0/opensearch-data-prepper-jdk-2.5.0-linux-x64.tar.gz
    dest: /tmp/opensearch-data-prepper.tar.gz
    mode: '0644'

- name: Extract Data Prepper
  unarchive:
    src: /tmp/opensearch-data-prepper.tar.gz
    dest: /opt/
    remote_src: yes
    creates: /opt/opensearch-data-prepper-jdk-2.5.0-linux-x64

- name: Verify Data Prepper binary exists
  stat:
    path: /opt/opensearch-data-prepper-jdk-2.5.0-linux-x64/bin/data-prepper
  register: dataprepper_bin

- name: Fail if Data Prepper binary is missing
  fail:
    msg: "Data Prepper binary not found after extraction!"
  when: not dataprepper_bin.stat.exists or not dataprepper_bin.stat.executable

- name: Create symlink for Data Prepper
  file:
    src: /opt/opensearch-data-prepper-jdk-2.5.0-linux-x64
    dest: /opt/data-prepper
    state: link
    force: yes

- name: Create Data Prepper config directory
  file:
    path: /opt/data-prepper/config
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Data Prepper pipelines directory
  file:
    path: /opt/data-prepper/pipelines
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Data Prepper pipeline config
  template:
    src: pipeline.yaml.j2
    dest: /opt/data-prepper/pipelines/pipeline.yaml
    owner: root
    group: root
    mode: '0644'

- name: Deploy Data Prepper config
  template:
    src: data-prepper-config.yaml.j2
    dest: /opt/data-prepper/config/data-prepper-config.yaml
    owner: root
    group: root
    mode: '0644'

- name: Create systemd service for Data Prepper
  template:
    src: data-prepper.service.j2
    dest: /etc/systemd/system/data-prepper.service
    owner: root
    group: root
    mode: '0644'
  notify: daemon-reload

- name: Create Data Prepper log directory
  file:
    path: /var/log/data-prepper
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Check if Suricata log file exists and is readable
  stat:
    path: /var/log/suricata/eve.json
  register: suricata_log

- name: Fail if Suricata log is missing
  fail:
    msg: "Suricata eve.json log not found or not readable!"
  when: not suricata_log.stat.exists or not suricata_log.stat.readable

- name: Show a sample of Suricata log
  shell: head -n 1 /var/log/suricata/eve.json
  register: suricata_sample
  changed_when: false
  ignore_errors: yes

- name: Debug Suricata log sample
  debug:
    msg: "{{ suricata_sample.stdout | default('No sample available') }}"

- name: Enable and start Data Prepper
  systemd:
    name: data-prepper
    enabled: yes
    state: started
    daemon_reload: yes

- name: Pause briefly before port check
  pause:
    seconds: 2

- name: Wait for Data Prepper to start (fail if not up)
  wait_for:
    port: 2021
    host: 127.0.0.1
    delay: 2
    timeout: 120

- name: Check Data Prepper health endpoint
  uri:
    url: http://localhost:2021/health_check
    method: GET
    status_code: 200
  register: data_prepper_health
  ignore_errors: yes

- name: Fail if Data Prepper health endpoint is not healthy
  fail:
    msg: "Data Prepper health endpoint not available or unhealthy!"
  when: data_prepper_health.status != 200

- name: Check Data Prepper logs for errors
  shell: tail -n 20 /var/log/data-prepper/data-prepper.log
  register: dp_logs
  changed_when: false
  ignore_errors: yes

- name: Debug Data Prepper logs
  debug:
    msg: "{{ dp_logs.stdout | default('No Data Prepper logs found') }}"

- name: Check OpenSearch for Suricata logs
  uri:
    url: "https://{{ opensearch.host }}:{{ opensearch.port }}/suricata-logs/_search"
    user: "{{ opensearch.username }}"
    password: "{{ opensearch.password }}"
    method: GET
    validate_certs: no
    status_code: 200
  register: suricata_logs_check
  ignore_errors: yes

- name: Fail if OpenSearch index is empty
  fail:
    msg: "No Suricata logs found in OpenSearch!"
  when: suricata_logs_check.json.hits.total.value | default(0) == 0

- name: Debug OpenSearch log sample
  debug:
    msg: "{{ suricata_logs_check.json.hits.hits[0]._source if suricata_logs_check.json.hits.hits|length > 0 else 'No logs found' }}"
